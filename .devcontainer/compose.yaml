# Added on top of the root docker-compose.yml by devcontainer.json: the container the editor
# attaches to, with the dev image (Dockerfile next to this file). The running services are
# release images of their own, so each app's deps and _build live in this container's named
# volumes, never in the host's directories. It reaches the services, Postgres and RabbitMQ by
# their service names. The dialyzer PLTs (`mix quality`) live under _build, so the container's
# never clash with the host's.
#
# Without VS Code, the same container runs with Docker alone:
#
#   docker compose -f docker-compose.yml -f .devcontainer/compose.yaml up -d
#   docker compose -f docker-compose.yml -f .devcontainer/compose.yaml exec workspace bash

name: banking

# Relative paths resolve against the first file, the root docker-compose.yml, so they start at
# the repo root.
services:
  workspace:
    build: .devcontainer
    command: sleep infinity
    working_dir: /workspace
    environment:
      PGHOST: postgres
      RABBITMQ_URL: amqp://banking:banking@rabbitmq:5672
      # Where the e2e stories find the running services.
      ACCOUNTS_URL: http://accounts:4000
      LEDGER_URL: http://ledger:4001
    volumes:
      - .:/workspace
      - accounts-deps:/workspace/apps/accounts/deps
      - accounts-build:/workspace/apps/accounts/_build
      - ledger-deps:/workspace/apps/ledger/deps
      - ledger-build:/workspace/apps/ledger/_build
      - e2e-deps:/workspace/apps/e2e/deps
      - e2e-build:/workspace/apps/e2e/_build
    depends_on:
      - postgres
      - rabbitmq

volumes:
  accounts-deps:
  accounts-build:
  ledger-deps:
  ledger-build:
  e2e-deps:
  e2e-build:
