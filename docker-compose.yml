# The whole local stack: infrastructure plus both services. Only Docker is needed.
#
#   docker compose up -d --wait    # start (the first run builds both images: a few minutes)
#   docker compose up -d --build   # rebuild the images after a code change
#   docker compose logs -f accounts ledger
#   docker compose down            # stop (data is kept in named volumes)
#   docker compose down -v         # stop and wipe the data
#
# To run the services on the host instead (`iex -S mix phx.server`), start only the
# infrastructure: `docker compose up -d postgres rabbitmq swagger-ui`.
#
# The dev container (.devcontainer/) adds a `workspace` service to this file, for the editor,
# `mix test` and the e2e stories.

name: banking

# The services run in production mode: each image is a `mix release` built from apps/<service>
# by its Dockerfile. `bin/setup` (<App>.Release.setup/0) is the release's `mix setup`, idempotent,
# so it runs on every start. The databases are the *_prod ones, next to the dev and test ones.
x-release-env: &release-env
  RABBITMQ_URL: amqp://banking:banking@rabbitmq:5672
  PHX_HOST: localhost
  # Local only, not a secret: the APIs keep no session or signed data.
  SECRET_KEY_BASE: local-only-secret-key-base-for-the-docker-stack-not-used-in-any-real-deploy

services:
  # One Postgres server for both services. Each service keeps its own databases —
  # read models and event store — so no database is shared (README, section 6):
  # accounts_prod, accounts_eventstore_prod, ledger_prod, ledger_eventstore_prod, created by
  # the services' `bin/setup`, plus the *_dev and *_test ones of `mix setup` / `mix test`.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Message transport between the services (README, D3): commands to a queue owned
  # by the ledger, events back on a topic exchange.
  # Management UI: http://localhost:15672 (banking / banking).
  rabbitmq:
    image: rabbitmq:4-management
    # A fixed hostname keeps the node name, and with it the data in the volume, across
    # recreated containers.
    hostname: rabbitmq
    environment:
      # `guest` only logs in from localhost, and published ports reach the broker
      # through Docker's network, so a dedicated user is needed.
      RABBITMQ_DEFAULT_USER: banking
      RABBITMQ_DEFAULT_PASS: banking
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Its setup runs the seeds, which open the bank's pix-settlement account; deposits need it (D13).
  ledger:
    image: banking-ledger
    build: apps/ledger
    command: sh -c "bin/setup && exec bin/server"
    environment:
      <<: *release-env
      PORT: 4001
      DATABASE_URL: ecto://postgres:postgres@postgres/ledger_prod
      EVENT_STORE_URL: ecto://postgres:postgres@postgres/ledger_eventstore_prod
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4001/api/trial-balance"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
      start_interval: 2s

  # Starts once the ledger is healthy: the ledger declares the `ledger.commands` queue, and
  # the publisher returns a command that no queue takes (mandatory).
  accounts:
    image: banking-accounts
    build: apps/accounts
    command: sh -c "bin/setup && exec bin/server"
    environment:
      <<: *release-env
      PORT: 4000
      DATABASE_URL: ecto://postgres:postgres@postgres/accounts_prod
      EVENT_STORE_URL: ecto://postgres:postgres@postgres/accounts_eventstore_prod
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4000/api/accounts?customer_id=healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1m
      start_interval: 2s

  # Proposed HTTP APIs of both services (OpenAPI 3.1), one spec each, picked from
  # the dropdown: http://localhost:8080. The specs are mounted, so a reload shows
  # an edit. "Try it out" calls the services on 4000 (accounts) and 4001 (ledger),
  # which need CORS for the 8080 origin once the endpoints exist.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      URLS: >-
        [{"name": "Accounts", "url": "/specs/accounts.yaml"},
         {"name": "Ledger", "url": "/specs/ledger.yaml"}]
    ports:
      - "8080:8080"
    volumes:
      - ./apps/accounts/priv/openapi.yaml:/usr/share/nginx/html/specs/accounts.yaml:ro
      - ./apps/ledger/priv/openapi.yaml:/usr/share/nginx/html/specs/ledger.yaml:ro

volumes:
  postgres-data:
  rabbitmq-data:
